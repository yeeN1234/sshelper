[package]
name = "sshelper-cli"
description = "sshelper command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sshelper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
console = "0.16.6"
inquire = "0.9.4"
sshelper-core = { path = "../sshelper-core" }

[build-dependencies]
winresource = "0.1.31"
