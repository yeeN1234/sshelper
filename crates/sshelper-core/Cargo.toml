[package]
name = "sshelper-core"
description = "Core library of sshelper: deploy an SSH public key and write ~/.ssh/config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
getrandom = "0.4.3"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "net", "time", "macros", "io-util", "sync", "rt-multi-thread"] }
