name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --workspace

  # Full deployment against a disposable OpenSSH server (CLI and GUI).
  e2e:
    runs-on: ubuntu-latest
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        ports: ["2222:2222"]
        env:
          PUID: "1000"
          PGID: "1000"
          PASSWORD_ACCESS: "true"
          USER_NAME: tester
          USER_PASSWORD: sshelper-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Wait for sshd
        run: for i in $(seq 30); do nc -z 127.0.0.1 2222 && break; sleep 2; done
      - name: CLI deploy
        run: |
          dir=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N "" -f "$dir/id_ci"
          echo sshelper-test | cargo run -p sshelper-cli -- --ssh-dir "$dir" -k id_ci \
            -H tester@127.0.0.1 -p 2222 -a ci --accept-new-host-key --password-stdin
          ssh -F "$dir/config" -o UserKnownHostsFile="$dir/known_hosts" -o BatchMode=yes ci true
      - name: GUI deploy (egui_kittest)
        env:
          SSHELPER_E2E_TARGET: tester@127.0.0.1
          SSHELPER_E2E_PORT: "2222"
          SSHELPER_E2E_PASSWORD: sshelper-test
        run: cargo test -p sshelper-gui -- --ignored
